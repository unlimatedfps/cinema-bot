name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sSL --compressed -A "Mozilla/5.0 (Linux; Android 13) Chrome/131 Mobile Safari/537.36" -w "\nHTTP %{http_code} %{size_download}\n" "https://egy.voxcinemas.com/showtimes?c=city-centre-almaza" -o l.html
          python3 - <<'PY'
          import re
          h=open('l.html',encoding='utf-8',errors='replace').read()
          print(len(h))
          for m in re.finditer(r'<input type="hidden"[^>]*>',h): print(m.group(0))
          i=h.find('date-filter'); print(re.sub(r'\s+',' ',h[i:i+1500]))
          print(re.findall(r'data-slug="([^"]+)"',h)[:40])
          PY
