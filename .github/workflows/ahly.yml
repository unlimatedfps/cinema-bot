name: ahly-tickets

on:
  schedule:
    # GitHub only starts scheduled runs about once an hour in practice, so
    # every run keeps checking on its own for most of an hour (loop.sh).
    # A run that fires while another is going waits for it to finish.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print messages instead of sending them"
        type: boolean
        default: false
      minutes:
        description: "How long this run keeps checking"
        type: string
        default: "55"

permissions:
  contents: write

concurrency:
  group: ahly-tickets
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Watch
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          STATE_FILE: "ahly_state.json"

        run: bash loop.sh ${{ inputs.minutes || '55' }} 120 ahly_state.json python ahly_bot.py
