name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import vox_bot as v
          html = v.fetch(v.BASE + "/showtimes?c=" + v.CINEMA + "&d=20261125")
          i = html.find('data-slug="lela-bazit-khalis-arabic"'); import re
          seg = html[i:i+20000]; seg = seg[:seg.find('<article',10)] if '<article' in seg[10:] else seg
          print("cinemas in Lela block:", re.findall(r'<h3[^>]*>\s*([^<]+?)\s*</h3>', seg))
          for r in v.parse_page(html, "20261125"):
              if "Lela" in r["movie"]: print(r["date"], v.nice_time(r["time"]), r["experience"])
          PY
