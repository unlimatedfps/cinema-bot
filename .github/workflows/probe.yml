name: probe-premiere

# Temporary, manual-only: can a GitHub runner reach premiere-cinemas.com at
# all, and where do its showtimes live? Plain requests, nothing disguised.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reachability
        run: |
          UA='cinema-bot/1.0 (personal showtimes watcher)'
          for U in \
            'https://www.premiere-cinemas.com/en' \
            'https://www.premiere-cinemas.com/en/movie-details/5180.855/1' \
            'https://www.premiere-cinemas.com/' ; do
            echo "--- $U"
            curl -sS -o "page_$(echo "$U" | md5sum | cut -c1-8).html" -m 40 \
                 -A "$UA" --compressed "$U" \
                 -w 'HTTP %{http_code}  bytes=%{size_download}  time=%{time_total}s\n' \
              || echo "request failed"
            sleep 3
          done
          echo
          ls -la page_*.html 2>/dev/null || true
          echo
          echo "=== biggest page, first 600 chars ==="
          B=$(ls -S page_*.html 2>/dev/null | head -1)
          [ -n "$B" ] && head -c 600 "$B"
