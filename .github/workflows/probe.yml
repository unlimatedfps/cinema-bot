name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36"
          js=$(curl -sSL -A "$UA" https://www.tazkarti.com/ | grep -oE 'main\.[a-f0-9]+\.js' | head -1)
          curl -sSL -A "$UA" -o m.js "https://www.tazkarti.com/$js"
          python3 - <<'PY'
          import re
          s=open('m.js',encoding='utf-8',errors='replace').read()
          for k in ['MatchesStatic_APIURL','MatchesAPIURL:','getMatchesAPIURL()+','.json?_=','matches-list','MatchesStatic','tazkarti.com/']:
              for m in list(re.finditer(re.escape(k),s))[:6]:
                  print('##',k,'::',s[max(0,m.start()-250):m.end()+250].replace('\n',' '))
          PY
