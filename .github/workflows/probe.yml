name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36"
          curl -sSL -A "$UA" -o idx.html -w "index %{http_code} %{size_download}\n" https://www.tazkarti.com/ || true
          head -c 3000 idx.html; echo
          for js in $(grep -oE 'src="[^"]+\.js"' idx.html | sed 's/src="//;s/"//'); do
            curl -sSL -A "$UA" -o "b_$(basename $js)" "https://www.tazkarti.com/$js"
            echo "== $js $(wc -c < b_$(basename $js))"
            grep -oE '"[^"]{0,80}(api|Api|API|json|data/)[^"]{0,80}"' "b_$(basename $js)" | sort -u | head -80
          done
