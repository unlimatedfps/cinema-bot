name: cinema-watch

on:
  schedule:
    # Only Avengers: Doomsday is followed now, so a pass is a handful of
    # requests and can run every 5 min (GitHub may start runs late).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message instead of sending it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cinema-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: "scene_state.json"
          MOVIE_FILTER: "doomsday"
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # One pass per run; a full scan takes about 70s and the cron
          # schedule alone sets the rhythm.
          RUN_SECONDS: "0"
        run: python scene_bot.py

      - name: Commit state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "cinema-bot"
          git config user.email "cinema-bot@users.noreply.github.com"
          git add scene_state.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "state $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X ours && git push && exit 0
            sleep 5
          done
          exit 1
