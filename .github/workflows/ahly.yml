name: ahly-tickets

on:
  schedule:
    # GitHub's shortest schedule. Runs can start a few minutes late
    # (sometimes more) when GitHub is busy.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message instead of sending it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ahly-tickets
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check Tazkarti
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python ahly_bot.py

      - name: Commit state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "cinema-bot"
          git config user.email "cinema-bot@users.noreply.github.com"
          git add ahly_state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "ahly state $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X ours && git push && exit 0
            sleep 5
          done
          exit 1
