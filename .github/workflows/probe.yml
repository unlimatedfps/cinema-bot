name: probe-scene

# Temporary, manual-only: runs scene_bot.py against the live site with no
# Telegram and no saved state, printing what it parsed and how long a full
# pass takes. Removed once the watcher is wired up for real.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Dry run
        env:
          DRY_RUN: "1"
          RUN_SECONDS: "0"
          STATE_FILE: "/tmp/probe_state.json"
        run: |
          # Pre-seed as bootstrapped with nothing seen, so every parsed
          # showtime counts as new and the formatted message is printed.
          echo '{"seen":{},"bootstrapped":true}' > /tmp/probe_state.json
          start=$(date +%s)
          python - <<'PYX'
          import scene_bot as s
          rows, failed = s.collect()
          print("ROWS", len(rows), "FAILED", failed[:5])
          exps = {}
          for r in rows:
              exps[r["experience"]] = exps.get(r["experience"], 0) + 1
          print("EXPERIENCES:")
          for k, v in sorted(exps.items(), key=lambda x: -x[1]):
              print("   %-28r %d" % (k, v))
          print("MOVIES:", len({r["movie"] for r in rows}))
          print("DATES:", sorted({r["date"] for r in rows}))
          print("UNIQUE IDS:", len({r["id"] for r in rows}))
          PYX
          echo "ELAPSED $(( $(date +%s) - start ))s"
